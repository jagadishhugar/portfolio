<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Pill Navigation</title>
  <style>
    /* Dark background setup */
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Main capsule container */
    .navbar-pill {
      position: relative; /* Essential for positioning the sliding background */
      display: flex;
      align-items: center;
      background-color: #ffffff;
      padding: 8px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      z-index: 1;
    }

    /* Individual navigation links */
    .nav-item {
      position: relative;
      text-decoration: none;
      color: #000000;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
      padding: 14px 28px;
      border-radius: 40px;
      z-index: 3; /* Keeps text above the sliding indicator */
      transition: color 0.3s ease;
    }

    /* When an item is active or hovered, its text turns white */
    .nav-item.active,
    .nav-item.hovered {
      color: #ffffff;
    }

    /* The sliding black pill background */
    .nav-indicator {
      position: absolute;
      background-color: #000000;
      border-radius: 40px;
      top: 8px;
      left: 8px;
      height: calc(100% - 16px); /* Perfect height matching the text padding */
      width: 0;
      z-index: 2;
      /* This property creates the smooth fluid sliding animation */
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1); 
    }
  </style>
</head>
<body>

  <nav class="navbar-container">
    <div class="navbar-pill">
      <div class="nav-indicator" id="indicator"></div>

      <a href="#" class="nav-item">HOME</a>
      <a href="#" class="nav-item">PRICING</a>
      <a href="#" class="nav-item">ABOUT</a>
      <a href="#" class="nav-item active">SERVICES</a>
      <a href="#" class="nav-item">CONTACT</a>
    </div>
  </nav>

  <script>
    const navbar = document.querySelector('.navbar-pill');
    const items = document.querySelectorAll('.nav-item');
    const indicator = document.getElementById('indicator');

    // Function to calculate and move the black pill background
    function moveIndicator(element) {
      const navbarRect = navbar.getBoundingClientRect();
      const elementRect = element.getBoundingClientRect();

      // Calculate position relative to the parent container
      const leftPos = elementRect.left - navbarRect.left;
      
      // Set the width and horizontal position dynamically
      indicator.style.left = `${leftPos}px`;
      indicator.style.width = `${elementRect.width}px`;
    }

    // Find the default active item (SERVICES) on page load
    const activeItem = document.querySelector('.nav-item.active');
    if (activeItem) {
      moveIndicator(activeItem);
    }

    // Add mouse behaviors to each item
    items.forEach(item => {
      // On Hover: Slide indicator to current item and change text colors
      item.addEventListener('mouseenter', (e) => {
        items.forEach(i => i.classList.remove('active', 'hovered'));
        e.target.classList.add('hovered');
        moveIndicator(e.target);
      });

      // On Mouse Leave: Return the slider back to the original active item
      item.addEventListener('mouseleave', () => {
        items.forEach(i => i.classList.remove('hovered'));
        if (activeItem) {
          activeItem.classList.add('active');
          moveIndicator(activeItem);
        }
      });
      
      // Optional: Update the permanent active item if clicked
      item.addEventListener('click', (e) => {
        items.forEach(i => i.classList.remove('active'));
        e.target.classList.add('active');
      });
    });
  </script>

</body>
</html>
